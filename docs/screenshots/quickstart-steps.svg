<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-border-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="card-border-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="arrow-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="arrow-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .step-text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: -0.01em;
    }
    .step-text-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      fill: #94A3B8;
      line-height: 1.4;
    }
    .step-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .step-badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Container Backdrop -->
  <rect x="0" y="0" width="1200" height="220" rx="20" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- ==================== STEP 01 ==================== -->
  <g transform="translate(20, 20)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="360" height="180" rx="16" fill="url(#card-grad-1)" stroke="url(#card-border-1)" stroke-width="1.2" />
    
    <!-- Top Bar: Badge & Vector Icon -->
    <rect x="20" y="20" width="58" height="24" rx="12" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="32" y="36" fill="#38BDF8" class="step-badge-text">01</text>

    <!-- Vector Laptop Icon (No Emoji) -->
    <g transform="translate(304, 18)">
      <rect x="2" y="2" width="28" height="18" rx="2" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" />
      <path d="M0 22h32c1.1 0 2 .9 2 2v1H-2v-1c0-1.1.9-2 2-2z" fill="#38BDF8" />
      <line x1="8" y1="11" x2="24" y2="11" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 2" />
    </g>

    <!-- Step Title -->
    <text x="20" y="78" class="step-text-title">Start on Your Laptop</text>
    
    <!-- Step Subtitle -->
    <text x="20" y="103" class="step-text-desc">Run AirBridge on Windows, Mac, or Linux.</text>
    
    <!-- Hero Highlight Pill -->
    <rect x="20" y="126" width="320" height="34" rx="8" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="143" r="3.5" fill="#38BDF8" />
    <text x="46" y="147" fill="#38BDF8" class="step-pill-text">Only your computer needs an install</text>
  </g>

  <!-- Flow Connector 1 (Arrow) -->
  <g transform="translate(388, 102)">
    <line x1="0" y1="8" x2="20" y2="8" stroke="url(#arrow-grad-1)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />
    <path d="M16 2l6 6-6 6" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== STEP 02 ==================== -->
  <g transform="translate(420, 20)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="360" height="180" rx="16" fill="url(#card-grad-2)" stroke="url(#card-border-2)" stroke-width="1.2" />
    
    <!-- Top Bar: Badge & Vector Icon -->
    <rect x="20" y="20" width="58" height="24" rx="12" fill="#818CF8" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="32" y="36" fill="#818CF8" class="step-badge-text">02</text>

    <!-- Vector Mobile & QR Target Icon (No Emoji) -->
    <g transform="translate(308, 16)">
      <rect x="4" y="2" width="20" height="32" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="1.8" />
      <line x1="11" y1="5" x2="17" y2="5" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round" />
      <!-- QR Crosshair Finder -->
      <path d="M8 12h3v3M20 12h-3v3M8 24h3v-3M20 24h-3v-3" stroke="#A5B4FC" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="14" cy="18" r="1.5" fill="#818CF8" />
    </g>

    <!-- Step Title -->
    <text x="20" y="78" class="step-text-title">Scan QR on Your Phone</text>
    
    <!-- Step Subtitle -->
    <text x="20" y="103" class="step-text-desc">Point iPhone or Android camera at the QR code.</text>
    
    <!-- Hero Highlight Pill -->
    <rect x="20" y="126" width="320" height="34" rx="8" fill="#818CF8" fill-opacity="0.1" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="143" r="3.5" fill="#818CF8" />
    <text x="46" y="147" fill="#A5B4FC" class="step-pill-text">Zero apps to download or install</text>
  </g>

  <!-- Flow Connector 2 (Arrow) -->
  <g transform="translate(788, 102)">
    <line x1="0" y1="8" x2="20" y2="8" stroke="url(#arrow-grad-2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" />
    <path d="M16 2l6 6-6 6" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== STEP 03 ==================== -->
  <g transform="translate(820, 20)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="360" height="180" rx="16" fill="url(#card-grad-3)" stroke="url(#card-border-3)" stroke-width="1.2" />
    
    <!-- Top Bar: Badge & Vector Icon -->
    <rect x="20" y="20" width="58" height="24" rx="12" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
    <text x="32" y="36" fill="#34D399" class="step-badge-text">03</text>

    <!-- Vector Lightning / High-Speed Beam Wave Icon (No Emoji) -->
    <g transform="translate(306, 18)">
      <path d="M18 1l-10 14h9l-4 13 13-16h-9l7-11z" fill="#34D399" />
    </g>

    <!-- Step Title -->
    <text x="20" y="78" class="step-text-title">Beam &amp; Sync Instantly</text>
    
    <!-- Step Subtitle -->
    <text x="20" y="103" class="step-text-desc">Send large files, folders, and sync clipboard.</text>
    
    <!-- Hero Highlight Pill -->
    <rect x="20" y="126" width="320" height="34" rx="8" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="34" cy="143" r="3.5" fill="#34D399" />
    <text x="46" y="147" fill="#34D399" class="step-pill-text">Direct Gigabit LAN Speed (50–100+ MB/s)</text>
  </g>
</svg>
